[package]
name = "gitgoo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A git review tool: pick any two commits on any two branches and see everything that differs between them"
license = "MIT"
repository = "https://github.com/Kdansky/gitgoo"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
pollster = "1.0.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.1"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
